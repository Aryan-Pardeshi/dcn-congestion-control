<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Campus network: three LANs connect through access switches to gateway router R1, which reaches router R2 and the data-centre server over a 10 megabit bottleneck WAN link">
<rect x="0" y="0" width="960" height="560" fill="#0E2236"/>
<g font-family="Arial, sans-serif">
<!-- LAN 1 -->
<rect x="20" y="20" width="250" height="130" fill="none" stroke="#93A9BE" stroke-width="1.2" stroke-dasharray="6 4" rx="8"/>
<text x="32" y="42" fill="#E6EEF5" font-size="12" font-family="monospace">CS Lab</text>
<g stroke="#E6EEF5" stroke-width="1.4" fill="none">
<rect x="36" y="72" width="26" height="18"/><line x1="49" y1="90" x2="49" y2="96"/><line x1="42" y1="96" x2="56" y2="96"/>
<rect x="72" y="72" width="26" height="18"/><line x1="85" y1="90" x2="85" y2="96"/><line x1="78" y1="96" x2="92" y2="96"/>
<rect x="108" y="72" width="26" height="18"/><line x1="121" y1="90" x2="121" y2="96"/><line x1="114" y1="96" x2="128" y2="96"/>
</g>
<text x="144" y="88" fill="#93A9BE" font-size="14">…</text>
<text x="32" y="126" fill="#93A9BE" font-size="10" font-family="monospace">192.168.10.0/24 (40 hosts)</text>
<line x1="270" y1="85" x2="318" y2="85" stroke="#4FD1C5" stroke-width="2"/>
<rect x="318" y="71" width="74" height="28" fill="none" stroke="#E6EEF5" stroke-width="1.5"/>
<text x="322" y="114" fill="#E6EEF5" font-size="10" font-family="monospace">SW1</text>
<line x1="392" y1="85" x2="506" y2="255" stroke="#4FD1C5" stroke-width="2"/>
<text x="404" y="120" fill="#93A9BE" font-size="10" font-family="monospace">100 Mbps</text>
<text x="404" y="134" fill="#93A9BE" font-size="10" font-family="monospace">Gi0/0</text>
<!-- LAN 2 -->
<rect x="20" y="190" width="250" height="130" fill="none" stroke="#93A9BE" stroke-width="1.2" stroke-dasharray="6 4" rx="8"/>
<text x="32" y="212" fill="#E6EEF5" font-size="12" font-family="monospace">Admin office</text>
<g stroke="#E6EEF5" stroke-width="1.4" fill="none">
<rect x="36" y="242" width="26" height="18"/><line x1="49" y1="260" x2="49" y2="266"/><line x1="42" y1="266" x2="56" y2="266"/>
<rect x="72" y="242" width="26" height="18"/><line x1="85" y1="260" x2="85" y2="266"/><line x1="78" y1="266" x2="92" y2="266"/>
<rect x="108" y="242" width="26" height="18"/><line x1="121" y1="260" x2="121" y2="266"/><line x1="114" y1="266" x2="128" y2="266"/>
</g>
<text x="144" y="258" fill="#93A9BE" font-size="14">…</text>
<text x="32" y="296" fill="#93A9BE" font-size="10" font-family="monospace">192.168.20.0/24 (15 hosts)</text>
<line x1="270" y1="255" x2="318" y2="255" stroke="#4FD1C5" stroke-width="2"/>
<rect x="318" y="241" width="74" height="28" fill="none" stroke="#E6EEF5" stroke-width="1.5"/>
<text x="322" y="284" fill="#E6EEF5" font-size="10" font-family="monospace">SW2</text>
<line x1="392" y1="255" x2="506" y2="255" stroke="#4FD1C5" stroke-width="2"/>
<text x="404" y="248" fill="#93A9BE" font-size="10" font-family="monospace">100 Mbps</text>
<text x="404" y="262" fill="#93A9BE" font-size="10" font-family="monospace">Gi0/1</text>
<!-- LAN 3 -->
<rect x="20" y="360" width="250" height="130" fill="none" stroke="#93A9BE" stroke-width="1.2" stroke-dasharray="6 4" rx="8"/>
<text x="32" y="382" fill="#E6EEF5" font-size="12" font-family="monospace">Library</text>
<g stroke="#E6EEF5" stroke-width="1.4" fill="none">
<rect x="36" y="412" width="26" height="18"/><line x1="49" y1="430" x2="49" y2="436"/><line x1="42" y1="436" x2="56" y2="436"/>
<rect x="72" y="412" width="26" height="18"/><line x1="85" y1="430" x2="85" y2="436"/><line x1="78" y1="436" x2="92" y2="436"/>
<rect x="108" y="412" width="26" height="18"/><line x1="121" y1="430" x2="121" y2="436"/><line x1="114" y1="436" x2="128" y2="436"/>
</g>
<text x="144" y="428" fill="#93A9BE" font-size="14">…</text>
<text x="32" y="466" fill="#93A9BE" font-size="10" font-family="monospace">192.168.30.0/24 (20 hosts)</text>
<line x1="270" y1="425" x2="318" y2="425" stroke="#4FD1C5" stroke-width="2"/>
<rect x="318" y="411" width="74" height="28" fill="none" stroke="#E6EEF5" stroke-width="1.5"/>
<text x="322" y="454" fill="#E6EEF5" font-size="10" font-family="monospace">SW3</text>
<line x1="392" y1="425" x2="506" y2="255" stroke="#4FD1C5" stroke-width="2"/>
<text x="404" y="378" fill="#93A9BE" font-size="10" font-family="monospace">100 Mbps</text>
<text x="404" y="392" fill="#93A9BE" font-size="10" font-family="monospace">Gi0/2</text>
<!-- R1 -->
<circle cx="540" cy="255" r="34" fill="#0E2236" stroke="#E6EEF5" stroke-width="2"/>
<g stroke="#4FD1C5" stroke-width="1.8" fill="none">
<circle cx="540" cy="255" r="18"/>
<path d="M522 255 h36 M540 237 v36"/>
</g>
<text x="522" y="307" fill="#E6EEF5" font-size="11" font-family="monospace">R1 gateway</text>
<text x="478" y="321" fill="#93A9BE" font-size="10" font-family="monospace">congestion control module</text>
<rect x="600" y="218" width="26" height="12" fill="#F5B841" stroke="#93A9BE" stroke-width="0.8"/>
<rect x="600" y="234" width="26" height="12" fill="#F5B841" stroke="#93A9BE" stroke-width="0.8"/>
<rect x="600" y="250" width="26" height="12" fill="#4FD1C5" stroke="#93A9BE" stroke-width="0.8"/>
<rect x="600" y="266" width="26" height="12" fill="#4FD1C5" stroke="#93A9BE" stroke-width="0.8"/>
<text x="632" y="252" fill="#93A9BE" font-size="10" font-family="monospace">Output queue</text>
<text x="632" y="264" fill="#93A9BE" font-size="10" font-family="monospace">(buffer)</text>
<!-- WAN -->
<line x1="574" y1="255" x2="700" y2="255" stroke="#F5B841" stroke-width="4"/>
<text x="584" y="243" fill="#E6EEF5" font-size="11" font-family="monospace">10 Mbps WAN — bottleneck</text>
<text x="576" y="337" fill="#93A9BE" font-size="10" font-family="monospace">Se0/0/0 10.0.0.1/30</text>
<!-- R2 -->
<circle cx="728" cy="255" r="28" fill="#0E2236" stroke="#E6EEF5" stroke-width="2"/>
<g stroke="#4FD1C5" stroke-width="1.6" fill="none">
<circle cx="728" cy="255" r="14"/>
<path d="M714 255 h28 M728 241 v28"/>
</g>
<text x="718" y="299" fill="#E6EEF5" font-size="11" font-family="monospace">R2</text>
<text x="706" y="351" fill="#93A9BE" font-size="10" font-family="monospace">Se0/0/0 10.0.0.2/30</text>
<!-- server -->
<line x1="756" y1="255" x2="826" y2="255" stroke="#4FD1C5" stroke-width="2"/>
<text x="758" y="245" fill="#93A9BE" font-size="10" font-family="monospace">1 Gbps</text>
<rect x="826" y="222" width="114" height="66" fill="none" stroke="#E6EEF5" stroke-width="1.5"/>
<text x="834" y="244" fill="#E6EEF5" font-size="10" font-family="monospace">Data-centre</text>
<text x="834" y="258" fill="#E6EEF5" font-size="10" font-family="monospace">server</text>
<text x="834" y="274" fill="#93A9BE" font-size="10" font-family="monospace">172.16.0.10</text>
<ellipse cx="880" cy="150" rx="52" ry="26" fill="none" stroke="#93A9BE" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="852" y="154" fill="#93A9BE" font-size="11" font-family="monospace">Internet</text>
<line x1="760" y1="227" x2="848" y2="168" stroke="#93A9BE" stroke-width="1.2" stroke-dasharray="5 3"/>
<!-- legend -->
<rect x="300" y="502" width="640" height="46" fill="none" stroke="#2C5072" stroke-width="1" rx="6"/>
<line x1="316" y1="525" x2="348" y2="525" stroke="#4FD1C5" stroke-width="2"/>
<text x="354" y="529" fill="#93A9BE" font-size="10" font-family="monospace">LAN 100 Mbps</text>
<line x1="478" y1="525" x2="510" y2="525" stroke="#F5B841" stroke-width="4"/>
<text x="516" y="529" fill="#93A9BE" font-size="10" font-family="monospace">bottleneck WAN</text>
<line x1="648" y1="525" x2="680" y2="525" stroke="#93A9BE" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="686" y="529" fill="#93A9BE" font-size="10" font-family="monospace">LAN boundary</text>
<rect x="800" y="517" width="14" height="16" fill="none" stroke="#93A9BE" stroke-width="1"/>
<rect x="801" y="525" width="12" height="7" fill="#4FD1C5"/>
<text x="820" y="529" fill="#93A9BE" font-size="10" font-family="monospace">router queue</text>
</g>
</svg>
